worker_processes auto;

events {
  worker_connections 1024;
}

http {
  client_max_body_size 20m;

  # Backend NestJS API — anything starting with /api/
  upstream backend_upstream {
    server backend:3001;
  }

  # Chatbot Express service — /askbot and /policy_upload
  upstream chatbot_upstream {
    server chatbot:4000;
  }

  # Next.js frontend — everything else
  upstream frontend_upstream {
    server frontend:3000;
  }

  server {
    listen 80;

    # ── Backend API ──────────────────────────────────────────────
    location /api/ {
      proxy_pass http://backend_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Chatbot service ──────────────────────────────────────────
    location /askbot {
      proxy_pass http://chatbot_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      # Chat responses are streamed (chunked text) — disable buffering so
      # tokens reach the browser as they're generated instead of all at once.
      proxy_buffering off;
    }

    location /policy_upload {
      proxy_pass http://chatbot_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Frontend (Next.js) — everything else, including HMR/websocket ──
    location / {
      proxy_pass http://frontend_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      # Needed for Next.js websocket-based features (fast refresh, etc.)
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    }
  }
}
